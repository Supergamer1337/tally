<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="tally">
<title>tally</title>
<link rel="icon" href="/static/icon.svg?v={{.V}}" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-180.png?v={{.V}}">
<link rel="manifest" href="/static/manifest.webmanifest?v={{.V}}">
<link rel="stylesheet" href="/static/app.css?v={{.V}}">
</head>
<body>
<div class="app login">
  <main class="box">
    <h1 class="brand">tally</h1>
    {{if .Error}}<p class="err" role="alert">{{.Error}}</p>{{end}}
    {{if .SSO}}<a class="save sso" href="/auth/login">Sign in with {{.SSO}}</a>{{end}}
    {{if .Password}}
    <form method="post" action="/login" aria-label="Sign in with the password">
      <input type="text" name="username" value="tally" autocomplete="username" hidden>
      <input class="text" type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required{{if not .SSO}} autofocus{{end}}>
      <button class="{{if .SSO}}alt{{else}}save{{end}}">Sign in</button>
    </form>
    {{end}}
  </main>
</div>
</body>
</html>
